# Blueprint de deploy do vetflow-agent no Render.
#
# Autenticação por PASS-THROUGH: o chat age como o USUÁRIO LOGADO. O frontend
# envia o JWT do usuário no header Authorization do POST /chat; o agente o
# repassa ao MCP (VETFLOW_TOKEN). Portanto o servidor NÃO precisa de uma conta
# de serviço — VETFLOW_EMAIL/PASSWORD são apenas fallback opcional.
#
# Modelo BYOK para o LLM: nenhuma credencial de LLM fica no servidor. Quem usa o
# chat traz a própria API key (no navegador, enviada no POST /chat).
#
# O vetflow-mcp vem como git SUBMODULE em vendor/vetflow-mcp — build autocontido
# (sem clone externo anônimo). O Render clona submodules com a credencial da sua
# integração GitHub, então funciona mesmo com o vetflow-mcp PRIVADO.
#
# Como usar: no Render, New > Blueprint, aponte para este repositório. Depois
# preencha no painel as variáveis marcadas como sync:false.

services:
  - type: web
    name: vetflow-agent
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      pip install ./vendor/vetflow-mcp
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Backend VetFlow de produção (as ferramentas do MCP falam com ele).
      - key: VETFLOW_BASE_URL
        value: https://vetflow-backend-jn55.onrender.com
      # Origem do frontend permitida no CORS (a URL do seu Vercel). Obrigatória.
      - key: CORS_ORIGINS
        sync: false
      # Consome o vetflow-mcp IN-PROCESS (sem subprocesso stdio). Elimina o
      # segundo interpretador Python por request — o que causava o pico de RAM
      # (OOM/502) no plano free de 512MB. O isolamento por-usuário é preservado:
      # o JWT é escopado por request via contextvars (use_request_client). O
      # modo subprocesso continua sendo o default fora do deploy (Claude Desktop).
      - key: VETFLOW_MCP_INPROCESS
        value: "true"
      # BYOK para o LLM: nenhuma ANTHROPIC/OPENAI/GEMINI/AWS key aqui de propósito.
      # O provider/modelo vêm por request (a key do usuário, no navegador dele).
      #
      # VETFLOW_EMAIL/PASSWORD NÃO ficam aqui: no agente deployado a auth é
      # sempre pass-through (o JWT do usuário logado chega pelo header do /chat).
      # O modo email/senha segue existindo no vetflow-mcp, para clientes sem
      # usuário logado (ex.: Claude Desktop) — mas não é usado neste serviço.
