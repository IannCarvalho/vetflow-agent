[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vetflow-agent"
version = "1.0.0"
description = "Agente de IA multi-provider sobre o vetflow-mcp (API FastAPI + UI Streamlit)."
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.50.0",
    "anthropic>=0.39.0",
    "boto3>=1.34.0",
    "mcp>=2.3.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
# Testes e lint: `pip install -e ".[dev]"` (é o que o CI instala). A UI
# Streamlit tem as dependências dela em requirements-dev.txt.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    # ExceptionGroup só é builtin a partir do 3.11 (usado em test_mcp_bridge).
    "exceptiongroup>=1.2.0; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# vendor/vetflow-mcp é o submodule do MCP: outro projeto, com o lint dele.
extend-exclude = ["vendor"]

[tool.ruff.lint]
# Ruleset explícito para o CI e o ambiente local concordarem.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
    # tempfile.TemporaryFile precisa de controle manual do ciclo de vida: o
    # fileno é passado ao transporte stdio e fechado no finally de connect_session.
    "SIM115",
    # Alguns `with` aninhados (Streamlit placeholder+expander) ficam mais legíveis
    # assim do que num único with multi-contexto.
    "SIM117",
    # try/except/pass é limpeza best-effort deliberada (fechar errlog, ler stderr).
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# Testes podem usar asserts, credenciais fake e imports de conveniência.
"tests/**" = ["S101", "S105", "S106"]
