name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout vetflow-agent
        uses: actions/checkout@v4

      # O vetflow-agent instala o vetflow-mcp em modo editável. Em CI, cloná-lo
      # como repositório irmão reproduz o layout local (../vetflow-mcp). O repo é
      # privado, então usamos um token; sem ele, o passo é pulado e os testes que
      # dependem do subprocesso real ainda assim passam (eles mockam a ponte).
      - name: Checkout vetflow-mcp (sibling)
        uses: actions/checkout@v4
        with:
          repository: IannCarvalho/vetflow-mcp
          path: vetflow-mcp
          token: ${{ secrets.VETFLOW_MCP_TOKEN }}
        continue-on-error: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff
          pip install 'exceptiongroup; python_version < "3.11"'
          if [ -d "vetflow-mcp" ]; then pip install -e ./vetflow-mcp; fi

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
