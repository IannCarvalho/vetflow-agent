name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O job só lê o código: o GITHUB_TOKEN não precisa de escrita.
permissions:
  contents: read

# Um push novo no mesmo PR cancela o run anterior, que ficou obsoleto. Na main
# nada é cancelado: cada commit mergeado continua com o próprio resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é o mínimo do requires-python; 3.14 é o default do Render para
        # serviços Python novos.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # O vetflow-mcp vem como submodule em vendor/vetflow-mcp, no commit que o
      # deploy instala: os testes rodam contra o MCP que vai para produção.
      - name: Checkout (com o submodule do vetflow-mcp)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # requirements-dev.txt traz o streamlit, para o smoke test da UI rodar.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e ./vendor/vetflow-mcp -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
